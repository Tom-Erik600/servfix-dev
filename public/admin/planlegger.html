<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planlegger - Air-Tech Admin</title>
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
    <link rel="stylesheet" href="/admin/assets/css/planlegger.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <!-- Innhold lastes dynamisk av main.js -->
        </header>

        <main class="main-content">
            <div class="page-header">
                <div class="page-header-top">
                    <h1>Visuell Planlegger</h1>
                    <button id="open-overview-btn" class="btn-overview" title="Åpne service-oversikt">
                        📊 Service-oversikt
                    </button>
                </div>
                <p>Dra en tekniker og slipp på en kunde for å opprette serviceoppdrag. Maks 1 aktiv oppdrag per kunde.</p>
            </div>

            <!-- Enkel checkbox for å vise alle kunder -->
            <div class="simple-filter">
                <label class="filter-checkbox">
                    <input type="checkbox" id="show-available-customers">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">Vis også kunder som allerede har oppdrag</span>
                </label>
            </div>

            <div class="planner-layout">
                <aside class="planner-column" id="technician-column">
                    <h2>Teknikere</h2>
                    <div id="technician-list">
                        <!-- Teknikere lastes dynamisk -->
                    </div>
                </aside>
                
                <section class="planner-column" id="project-column">
                    <!-- NYTT: Søkeseksjon - LEGG TIL DETTE -->
                    <div class="customer-search-section">
                        <input type="text" 
                               id="customer-search-input" 
                               class="customer-search-input"
                               placeholder="Søk etter kunde (navn eller kundenummer)..."
                               autocomplete="off">
                        <div class="search-icon">🔍</div>
                    </div>
                    
                    <!-- EKSISTERENDE: Behold alt under her -->
                    <h2>Kunder uten oppdrag <span class="order-count-badge" id="order-count">0</span></h2>
                    <div id="project-list">
                        <!-- Kunder lastes dynamisk -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal for datovelger (samme som før) -->
    <div class="modal-overlay" id="date-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Opprett serviceoppdrag</h3>
            </div>
            
            <div class="modal-body">
                <p id="modal-info-text" class="modal-info-text"></p>
                
                <div class="form-group">
                    <label for="modal-date">Velg dato:</label>
                    <input type="date" id="modal-date" required>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Avbryt</button>
                <button type="button" id="modal-save-btn" class="btn btn-primary">Lagre Oppdrag</button>
            </div>
        </div>
    </div>

    <!-- Service-oversikt Modal -->
    <div class="modal-overlay" id="overview-modal">
        <div class="overview-modal-content">
            <!-- Header -->
            <div class="overview-header">
                <h2>📊 Service-oversikt</h2>
                <div class="overview-controls">
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="calendar" id="btn-calendar-view">
                            📅 Kunde
                        </button>
                        <button class="view-btn" data-view="technician" id="btn-technician-view">
                            👷 Tekniker
                        </button>
                    </div>
                    <button class="overview-close-btn" id="close-overview-btn" title="Lukk">×</button>
                </div>
            </div>

            <!-- Periode-navigasjon -->
            <div class="period-navigation">
                <button class="period-nav-btn" id="prev-period-btn">
                    ← Forrige
                </button>
                <div class="period-indicator">
                    <h3 id="period-title">Laster...</h3>
                    <span id="period-subtitle">Viser 6 måneder</span>
                </div>
                <button class="period-nav-btn" id="next-period-btn">
                    Neste →
                </button>
            </div>

            <!-- Statistikk-bar -->
            <div class="overview-stats">
                <div class="stat-item">
                    <span class="stat-icon">📋</span>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-total-orders">0</span>
                        <span class="stat-label">Oppdrag</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🏢</span>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-total-customers">0</span>
                        <span class="stat-label">Kunder</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">👷</span>
                    <div class="stat-content">
                        <span class="stat-value" id="stat-total-technicians">0</span>
                        <span class="stat-label">Teknikere</span>
                    </div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="overview-body">
                <!-- Kalender-visning (Kunde) -->
                <div class="calendar-grid-view" id="calendar-grid-view">
                    <!-- Fylles dynamisk med JavaScript -->
                </div>

                <!-- Tekniker-visning -->
                <div class="technician-list-view" id="technician-list-view" style="display: none;">
                    <!-- Fylles dynamisk med JavaScript -->
                </div>
            </div>

            <!-- Tekniker-legend (kun synlig i kalendervisning) -->
            <div class="technician-legend" id="technician-legend">
                <!-- Fylles dynamisk med JavaScript -->
            </div>
        </div>
    </div>

    <script src="/admin/assets/js/main.js"></script>
    <script src="/admin/assets/js/planlegger.js"></script>
</body>
</html>
